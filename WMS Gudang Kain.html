<style>

:root[data-theme="dark"]{--bg:#12171f;--card:#1b222d;--ink:#e8ebf0;--mute:#9aa4b2;--line:#2c3644;--acc:#7fb2e5;--kraft:#d9a15a;--ok:#6fcf97;--warn:#f2c14e;--bad:#ff8a80;--okbg:#1d3a2a;--warnbg:#3d3213;--badbg:#42201d;--infobg:#1d3047;color-scheme:dark}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{color:#10202f}}
header h1{font-size:18px;margin:0;font-weight:700;flex:1}

body.pet header,body.pet nav{display:none}body.pet main{max-width:560px;padding:12px}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}

body.pet [data-acc=batal]{display:none}
.phg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:6px}.pv img{max-height:56px;margin-top:4px;border-radius:4px;display:block}
.fgal{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fgal img{width:100%;border-radius:6px;border:1px solid var(--line)}.fgal figcaption{font-size:12px;color:var(--mute);margin-bottom:3px}.fgal figure{margin:0}
#f.chk>label:has([name=cari]){order:-3}#f.chk>label:has([name=ord]){order:-2}#f.chk>label:has([name=k]),#f.chk>label:has([name=p]),#f.chk>label:has([name=y]){order:-1}#f.chk>label:first-child{order:1}#f.chk>button.p{order:2}

<body>
<header><h1>WMS Gudang Kain</h1><span id="sync" class="tag I">Memuat…</span>
<label style="color:inherit;flex-direction:row;align-items:center;gap:6px">Impor Inventory Control (.xlsx)<input id="file" type="file" accept=".xlsx" style="width:200px"></label>
<button id="mpet">Mode Petugas</button><button id="exp">Unduh Excel</button><button id="rst">Hapus data</button></header>
<nav id="nav"></nav>

<datalist id="dl"></datalist><datalist id="dsj"></datalist><datalist id="dord"></datalist><datalist id="dpo"></datalist>
<script>
const KEY='wms_v2';
let S={items:{},tx:[],seq:1},tab='DASH',q='',fs='',sel='',pq='',hq='',LB=[],MODE='adm',NAME='',PK='',RM='',RS='',fx=false,STARTED=false,AO='',PINH='',PINOK=false,ME={k:'',n:'',g:'MAB05',p:'',y:''},IMP={},MAN={},PBL='A,B,C,D',PB=8,PT=4,DB=null,CAN=true,pend=false,LAST={};
const $=s=>document.querySelector(s);
const nf=(v,d=0)=>(+v).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOL=0.01;const eq=(a,b)=>Math.abs(a-b)<=TOL+1e-9,tod=()=>new Date().toISOString().slice(0,10);
function load(){try{PINH=localStorage.getItem('wms_pin')||''}catch(e){}try{NAME=localStorage.getItem('wms_name')||''}catch(e){}try{const t=localStorage.getItem('wms_tol');if(t!==null&&t!=='')TOL=+t}catch(e){}try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
function save(){if(DB)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){msg('Penyimpanan browser penuh atau diblokir. Unduh Excel sebagai cadangan.',1)}}
function msg(t,bad){const m=$('#msg');if(m){m.textContent=t;m.className=bad?'err':'good'}}
function setSync(t,c){const e=$('#sync');if(e){e.textContent=t;e.className='tag '+(c||'I')}}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function put(rec){if(DB){await DB.collection('tx').doc(rid()).set(rec)}else{S.tx.push({...rec,id:S.seq++});save()}}
async function delTx(id){if(DB){await DB.doc('tx/'+id).delete()}else{S.tx=S.tx.filter(t=>t.id!=id);save()}}
function rr(){const a=document.activeElement;if(a&&a.closest&&a.closest('#f,.pf')&&a.value){pend=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(pend&&!(a&&a.closest&&a.closest('#f,.pf'))){pend=false;render()}},60));
async function initDb(){
 try{if(typeof claude==='undefined')throw 0;DB=await claude.use('db');const u=await claude.use('user');if(DB&&u&&(await u.can('data.write'))===false)CAN=false}catch(e){DB=null}
 if(!DB){setSync('Mode lokal: data hanya di browser ini','W');return}
 setSync(CAN?'Data bersama, tersambung':'Hanya baca','OK');
 DB.collection('items').onSnapshot(sn=>{const it={};sn.docs.forEach(d=>(d.data().m||[]).forEach(r=>{it[r[0]]={n:r[1],g:r[2],p:r[3],y:r[4]}}));IMP=it;mergeItems()},e=>setSync('Gagal memuat item ('+e.code+')','B'));
 DB.collection('master').onSnapshot(sn=>{const m={};sn.docs.forEach(d=>{const v=d.data();if(v&&v.k)m[v.k]={n:v.n,g:v.g,p:+v.p||0,y:+v.y||0}});MAN=m;mergeItems()},e=>setSync('Gagal memuat master ('+e.code+')','B'));
 DB.collection('cfg').onSnapshot(sn=>{sn.docs.forEach(d=>{if(d.id=='main'&&d.data().tol!=null){TOL=+d.data().tol;rr()}if(d.id=='pin'){PINH=d.data().h||'';rr()}})},e=>{});
 DB.collection('tx').onSnapshot(sn=>{S.tx=sn.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.ts||0)-(b.ts||0));rr()},e=>setSync('Gagal memuat transaksi ('+e.code+')','B'))}
const F=(k,l,r,x)=>({k,l,r,...x});
const TABS={
 SJ:{l:'1 Inbound (SJ)',f:[F('sj','No. surat jalan',1),F('pihak','Suppliers',1),F('desc','Description'),F('partai','No. Partai'),F('pl','Link packing list'),F('month','Month',0,{ro:1}),F('petugas','PIC team inbound')]},
 TRM:{l:'2 Terima & cek SJ',f:[F('sj','No. surat jalan',1),F('desc','Description'),F('partai','No. Partai'),F('kondisi','Condition item',0,{o:['Baik','Rusak','Basah','Kotor','Cacat','Kurang','Lainnya']}),F('month','Month',0,{ro:1}),F('foto','Foto',0,{ph:1}),F('petugas','PIC team inbound')]},
 RAK:{l:'3 Masuk rak',f:[F('sj','No. SJ (kosong = stok awal)'),F('rak','Kode rak',1,{rk:1}),F('nama','Nama barang',0,{ro:1}),F('petugas','Petugas')]},
 PICK:{l:'4 Picker / order',f:[F('ord','No. order',1),F('po','No. PO'),F('pl','No. Packing list'),F('pihak','Customer'),F('rak','Diambil dari rak',1,{rk:1}),F('nama','Nama barang',0,{ro:1}),F('petugas','Picker')]},
 CHK:{l:'5 Checker',f:[F('cari','Cari No. PO / No. Packing list',1),F('ord','No. order',1,{ro:1}),F('nama','Nama barang',0,{ro:1}),F('desain','Kode desain',1),F('warna','Warna',1),F('petugas','Checker')]},
 MUAT:{l:'7 Muat',f:[F('ord','No. order',1),F('nama','Nama barang',0,{ro:1}),F('desain','Kode desain',1),F('warna','Warna',1),F('truk','No. kendaraan',1),F('petugas','Petugas muat')]},
 MOV:{l:'\u21c4 Pindah rak',f:[F('dari','Dari rak',1,{rk:1}),F('rak','Ke rak',1,{rk:1}),F('petugas','Petugas')]}};
const HELP={
 SJ:'Catat isi surat jalan persis sesuai keterangan SJ: satu baris per item dengan Pcs dan Yard menurut SJ. Satu SJ boleh berisi banyak item. Link packing list cukup diisi sekali per SJ. Month terisi otomatis dari tanggal.',
 TRM:'Catat barang yang benar-benar diterima per item. Pcs dan Yard tidak boleh melebihi isi SJ. SJ baru bisa diselesaikan bila semua item cocok. Isi kondisi barang saat diterima.',
 RAK:'Hanya barang dari SJ yang sudah selesai yang bisa masuk rak. Isi Rack (mis. A-1) dan Detail rack (mis. 5), otomatis digabung menjadi A-1-5. Kosongkan No. SJ untuk menempatkan stok awal.',
 PICK:'Picker mencatat barang yang diambil dari rak. Isi No. PO atau No. Packing list (salah satu cukup) agar order bisa dicari di Checker. Stok langsung terpotong sementara dan isi rak berkurang. Setelah semua item diambil, klik Selesaikan picking.',
 CHK:'Cari No. PO atau No. Packing list, pilih dari daftar, lalu pilih item. Pcs dan Yard terisi otomatis sesuai hasil Picker dan tidak bisa diubah. Periksa nama barang, kode desain, dan warna (terisi saran dari kode barang, koreksi bila perlu).',
 MUAT:'Hanya bisa untuk order yang sudah disetujui (pembayaran lunas dan pasti kirim). Periksa ulang dengan ketentuan yang sama dengan checker. Setelah tersimpan, stok rill terpotong.',
 MOV:'Pindahkan barang antar rak. Pcs dan Yard tidak boleh melebihi isi rak asal. Total stok tidak berubah.'};
const RE=/^([A-Z0-9]+)-([0-9]+)-([0-9]+)$/;
function canon(r){r=(r||'').trim().toUpperCase().replace(/ /g,'');const m=RE.exec(r);return m?m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+(+m[3]):r}
function sjData(){const J={};
 for(const t of S.tx){const s=t.x&&t.x.sj,T=t.t;if(!s||!['SJ','TRM','RAK','SJC'].includes(T))continue;const j=J[s]??={sj:s,pihak:'',tgl:t.tgl,L:{},st:'BUKA',cat:''};
  if(T=='SJC'){j.st=t.x.status;j.cat=t.x.cat||'';continue}
  const l=j.L[t.k]??={sp:0,sy:0,rp:0,ry:0,pp:0,py:0};
  if(T=='SJ'){j.pihak=t.x.pihak||j.pihak;l.sp+=t.p;l.sy+=t.y}else if(T=='TRM'){l.rp+=t.p;l.ry+=t.y}else{l.pp+=t.p;l.py+=t.y}}
 return J}
function ordData(){const O={};
 for(const t of S.tx){const s=t.x&&t.x.ord;if(!s||!['PICK','CHK','MUAT','OST','ACC','ORDX'].includes(t.t))continue;const o=O[s]??={ord:s,pihak:'',tgl:t.tgl,L:{},closed:false};
  if(t.t=='OST'){o.closed=true;continue}
  if(t.t=='ORDX'){o.batal=true;o.bx=t.x;continue}
  if(t.t=='ACC'){o.acc=t.x.status=='ACC';o.accx=t.x;continue}
  const l=o.L[t.k]??={pk:[0,0],ck:[0,0],mu:[0,0],d:'',w:''};
  if(t.t=='PICK'){o.pihak=t.x.pihak||o.pihak;o.po=t.x.po||o.po||'';o.pl=t.x.pl||o.pl||'';l.pk[0]+=t.p;l.pk[1]+=t.y}else if(t.t=='CHK'){l.ck[0]+=t.p;l.ck[1]+=t.y;l.d=t.x.desain;l.w=t.x.warna}else{l.mu[0]+=t.p;l.mu[1]+=t.y}}
 for(const o of Object.values(O)){const L=Object.values(o.L),all=f=>L.every(l=>l[f][0]==l.pk[0]&&eq(l[f][1],l.pk[1]));o.st=o.batal?'BATAL':!o.closed?'PICKING':all('mu')?'SELESAI':all('ck')?(o.acc?'MUAT':'PENDING'):'CHECKER'}
 return O}
function rackData(){const R={},CX=cxSet();const add=(r,k,p,y)=>{if(!r)return;const o=R[r]??={p:0,y:0,it:{}},i=o.it[k]??=[0,0];o.p+=p;o.y+=y;i[0]+=p;i[1]+=y};
 for(const t of S.tx){if(t.t=='RAK')add(canon(t.x.rak),t.k,t.p,t.y);else if(t.t=='PICK'){if(!CX.has(t.x.ord))add(canon(t.x.rak),t.k,-t.p,-t.y)}else if(t.t=='MOV'){add(canon(t.x.dari),t.k,-t.p,-t.y);add(canon(t.x.rak),t.k,t.p,t.y)}}return R}
const rackOf=k=>{const R=window._R||(window._R=rackData());return Object.keys(R).filter(r=>R[r].it[k]&&R[r].it[k][0]>0).join(', ')};
const MAP={TRM:'rec',PICK:'pk',CHK:'ck',MUAT:'mu'},ZZ=()=>({rec:[0,0],rs:[0,0],ri:[0,0],pk:[0,0],ck:[0,0],mu:[0,0]});
function agg(){const a={},CX=cxSet();for(const t of S.tx){if(t.x&&CX.has(t.x.ord))continue;let f=MAP[t.t];if(t.t=='RAK')f=t.x.sj?'rs':'ri';if(!f)continue;const o=a[t.k]??=ZZ();o[f][0]+=t.p;o[f][1]+=t.y}return a}
function met(k,a){const o=a[k]||ZZ(),b=S.items[k]||{p:0,y:0},m={},two=fn=>[fn(0),fn(1)];
 m.saldo=two(j=>(j?b.y:b.p)+o.rec[j]-o.mu[j]);m.belum=two(j=>Math.max(0,o.rec[j]-o.rs[j]));m.sem=two(j=>o.pk[j]-o.mu[j]);m.wchk=two(j=>o.pk[j]-o.ck[j]);m.wmu=two(j=>o.ck[j]-o.mu[j]);
 m.atp=two(j=>m.saldo[j]-m.sem[j]-m.belum[j]);
 m.st=m.saldo[0]<0?['Saldo minus','B']:m.belum[0]>0?['Belum di rak','W']:m.sem[0]>0?['Dalam proses order','I']:['OK','OK'];return m}
function chk(t,k,p,y,x){const J=sjData(),O=ordData(),a=agg(),R=rackData(),ck=r=>RE.test(canon(r))?'':'Format rak: BLOK-BARIS-TINGKAT, mis. A-1-5.';
 if(t=='SJ'){const j=J[x.sj];if(j&&j.st!='BUKA')return'SJ ini sudah ditutup. Gunakan nomor SJ lain.';if(x.pl&&!/^https?:[/][/]/i.test(x.pl))return'Link packing list harus diawali http:// atau https://.'}
 if(t=='TRM'){const j=J[x.sj];if(!j)return'No. SJ belum terdaftar. Isi SJ dulu di tab 1.';if(j.st!='BUKA')return'SJ ini sudah ditutup.';const l=j.L[k];if(!l)return'Item ini tidak ada di SJ '+x.sj+'.';
  if(l.rp+p>l.sp||l.ry+y>l.sy+0.011)return`Melebihi isi SJ. Sisa: ${nf(l.sp-l.rp)} pcs, ${nf(l.sy-l.ry,1)} yard.`}
 if(t=='RAK'){const e=ck(x.rak);if(e)return e;

 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(all),'RIWAYAT');
 XLSX.writeFile(wb,'WMS_export_'+tod()+'.xlsx')};
$('#rst').onclick=async()=>{if(!(await guard()))return;if(!(await uiConfirm('Hapus SEMUA item dan transaksi'+(DB?' untuk semua pengguna':' di browser ini')+'? Unduh Excel dulu bila perlu.')))return;try{if(DB){if(!CAN)return alert('Akun Anda tidak bisa menghapus.');for(const c of['items','master','tx','foto']){const sn=await DB.collection(c).get();for(const d of sn.docs)await DB.doc(c+'/'+d.id).delete()}}else{S={items:{},tx:[],seq:1};save();dlist();try{indexedDB.deleteDatabase('wms_foto')}catch(e){}}tab='DASH';render()}catch(er){alert('Gagal menghapus ('+(er.code||er.message)+').')}};
$('#mpet').onclick=()=>setMode('pet');
try{if(location.hash=='#petugas'){MODE='pet';tab='HOME'}}catch(e){}
if(typeof addEventListener!='undefined')addEventListener('hashchange',()=>{const m=location.hash=='#petugas'?'pet':'adm';if(m!=MODE){MODE=m;tab=m=='pet'?'HOME':'DASH';render()}});
load();dlist();render();initDb();
</script>
